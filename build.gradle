plugins {
    id 'com.gradleup.shadow' version '9.6.1'
    id 'java'
    id 'application'
}

apply from: "${rootDir}/quality-gates/quality-gates.gradle"

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

group  'com.philips.swcoe'
version  '2.0.0'
description  'Cerberus'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.philips.swcoe.cerberus.Cerberus'
}

configurations {
    extraLibs
    // Resolved on its own so the agent jar can be pinned as a -javaagent path.
    systemExitAgent {
        transitive = false
    }
}

dependencies {
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'net.sourceforge.pmd:pmd-java:7.27.0'
    implementation 'net.sourceforge.pmd:pmd-cpp:7.27.0'
    implementation 'net.sourceforge.pmd:pmd-jsp:7.27.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    implementation 'org.hibernate.validator:hibernate-validator:9.1.3.Final'
    implementation 'org.hibernate.validator:hibernate-validator-annotation-processor:9.1.3.Final'
    implementation 'jakarta.el:jakarta.el-api:6.0.1'
    // Hibernate Validator 9 needs a Jakarta EL 6 implementation for message
    // interpolation. The Glassfish EL RI was renamed to Expressly for EE 11,
    // so org.glassfish:jakarta.el stops at EL 5.
    implementation 'org.glassfish.expressly:expressly:6.0.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.7.1-jre'
    implementation 'org.apache.commons:commons-collections4:4.6.0'
    implementation 'org.codehaus.plexus:plexus-resources:1.4.0'
    implementation 'org.codehaus.plexus:plexus-utils:4.1.0'
    implementation 'org.json:json:20260814'
    implementation 'com.github.mauricioaniche:ck:0.7.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'io.vavr:vavr:1.0.1'
    implementation 'net.steppschuh.markdowngenerator:markdowngenerator:1.3.1.1'
    implementation 'org.commonmark:commonmark:0.30.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.30.0'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'com.ginsberg:junit5-system-exit:2.0.3'
    // junit5-system-exit 2.x intercepts System.exit with an agent instead of a
    // SecurityManager, which JEP 486 removed as of Java 24.
    systemExitAgent 'com.ginsberg:junit5-system-exit:2.0.3'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgumentProviders.add({
        ["-javaagent:${configurations.systemExitAgent.singleFile}".toString()]
    } as CommandLineArgumentProvider)
}
