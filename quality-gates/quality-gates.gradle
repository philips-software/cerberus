buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'de.aaschmid:gradle-cpd-plugin:3.5'
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.11'
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0'
    }

}

apply plugin: 'jacoco'
apply plugin: 'pmd'
apply plugin: 'checkstyle'
apply plugin: 'project-report'
apply plugin: de.aaschmid.gradle.plugins.cpd.CpdPlugin
apply plugin: com.github.spotbugs.snom.SpotBugsPlugin
apply plugin: info.solidsoft.gradle.pitest.PitestPlugin

jacoco {
    toolVersion = "0.8.15"
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.99
            }
//          We are excluding data objects from coverage, since they don't have any behaviours defined
//          Instead their behaviours are added from Lombak on runtime
            excludes = [
               'com.philips.swcoe.cerberus.cerebellum.codemetrics.java.results.*'
            ]
        }
    }
}


jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir("jacocoHtml")
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: ['com/philips/swcoe/cerberus/cerebellum/codemetrics/java/results/**'])
        }))
    }
}

pmd {
    consoleOutput = true
    // The gate runs PMD 7 on its own classpath. This is independent of the
    // PMD 6.55 that Cerberus itself embeds as a library: PMD 6's type
    // resolution uses an ASM that cannot read Java 25 class files, so as a
    // gate it silently errored on every file and reported zero violations.
    toolVersion = "7.27.0"
    ruleSets = []
    ruleSetFiles = files(
        "${rootDir}/quality-gates/static-analysis-rules/pmd-cerberus-rules.xml"
    )
    rulesMinimumPriority = 5
}
// This disables running PMD on test files ,
// I (aravind666) are doing intentionally here, because some times to test some things efficiantly we have to take
// Bad routes, We do agree that it is not so great to have some programming mistakes in test and it has to follow some standards
// But to follow standards of code with respect to form-matting and style we enforce it using Checkstyle.
// I might enable it in near future once we refactor tests to make it better for ever.
pmdTest.enabled = false

cpd {
    language = 'java'
    toolVersion = '7.27.0'
    ignoreLiterals = false
    ignoreFailures = false
}

cpdCheck {
    minimumTokenCount = 34
    reports {
        csv.required = false
        text {
            required = true
            outputLocation = layout.buildDirectory.file("reports/cpd.txt")
        }
    }
    source = files('src/main/java')
}

spotbugs {
    toolVersion = '4.10.4'
    effort = com.github.spotbugs.snom.Effort.MAX
    ignoreFailures = false
    showProgress = true
    excludeFilter = file("$rootDir/quality-gates/static-analysis-rules/spotbugs-exclude.xml")
}
// This disables running spotbugs on test files ,
// by default Spotbugs runs on tests also when ran with gradle check goal
// I (aravind666) really did not see a need for running this on tests, because, tests will have some
// error prone code because you expect obvious things pre-defined and assert absolute thing  you define.
spotbugsTest.enabled = false

spotbugsMain {
    description = "Runs spot bugs on production source code"
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file("reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

checkstyle {
    toolVersion = '14.1.0'
    configFile file("${rootDir}/quality-gates/static-analysis-rules/checkstyle.xml")
    configProperties.checkstyleSuppressionsPath = file("${rootDir}/quality-gates/static-analysis-rules/checkstyle-suppressions.xml").absolutePath
}

tasks.withType(Checkstyle) {
    reports {
        xml.required = false
        html.required = true
    }
}

pitest {
    junit5PluginVersion = '1.2.3'
    targetClasses = ['com.philips.swcoe.cerberus.*']
    testSourceSets = [sourceSets.test]
    mainSourceSets = [sourceSets.main]
    avoidCallsTo = ['java.util.logging', 'org.apache.log4j',
                    'org.slf4j', 'org.apache.commons.logging',
                    'com.philips.swcoe.cerberus.cerebellum.codemetrics.java.results']
    // PIT runs the suite in its own minion JVMs, which do not inherit the test
    // task's arguments, so the System.exit agent has to be handed over here too
    // or the @ExpectSystemExitWithStatus tests fail before mutation even starts.
    jvmArgs.set(providers.provider {
        ['-Xmx1024m', "-javaagent:${configurations.systemExitAgent.singleFile}".toString()]
    })
    pitestVersion = '1.30.0'
    threads = 4
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 96
    coverageThreshold = 96
    exportLineCoverage = true
    // Set failWhenNoMutations to false to prevent build failures from Spring detection
    failWhenNoMutations = false
}
